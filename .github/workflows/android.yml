name: Build Android APK & AAB (Play Store)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ۱. د جاوا ۲۱ پاخه تنظیمات (د Gradle د نویو نسخو لپاره)
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # ۲. د ویب کتابتونونو او Capacitor ځای پر ځای کول
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/share @capacitor/filesystem

      # ۳. د اپلیکیشن کاري فایلونو جوړول (Build)
      - name: Build Web App
        run: npm run build

      # ۴. د Capacitor برخه چې ویب په انډرایډ بدلوي
      - name: Sync with Capacitor
        run: |
          npx cap init "د ويناوالۍ لارښود" "com.amanmedia.speaker" --web-dir dist
          npx cap add android
          npx cap sync android

      # ۵. د نوي هویت او ښکلي انځور (Logo) لګول
      - name: Generate Icon
        run: |
          if [ -f "logo.png" ]; then
            mkdir -p assets
            cp logo.png assets/icon.png
            npx capacitor-assets generate --android
          else
            echo "Warning: logo.png not found, skipping icon generation."
          fi

      # ۶. د سټوریج او انټرنیټ اړینې اجازې (Manifest Permissions)
      - name: Inject Permissions and Fix Configuration
        run: |
          cd android/app/src/main
          
          # په AndroidManifest.xml کې د انټرنیټ، غږ او ذخیره کولو اجازې ځای پر ځای کول
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <application/g' AndroidManifest.xml
          
          # د پرانیستي ترافیک (HTTP) او زاړه سټوریج سیسټم ملاتړ فعالول
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' AndroidManifest.xml
          
          # د بشپړ تایید لپاره د فایل کتل
          cat AndroidManifest.xml

      # ۷. د هغو تکراري کتابتونونو حلول چې د Kotlin ګډوډي رامنځته کوي
      - name: Fix Kotlin Dependency Conflict
        run: |
          cd android
          echo "" >> build.gradle
          echo "allprojects {" >> build.gradle
          echo "    configurations.all {" >> build.gradle
          echo "        resolutionStrategy {" >> build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      # ۸. د ټیسټ او لاسي نصبولو لپاره د APK جوړول (assembleDebug)
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ۹. پلي سټور ته د اپلوډ او خپرولو لپاره د AAB بڼې جوړول (bundleRelease)
      - name: Build Android Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      # ۱۰. اختیاري: په اتوماتیک ډول د ګوګل پلی ترتیباتو سره لاسلیک کول (که چیرې شتون ولري)
      - name: Sign Android Release AAB
        uses: ilharp/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      # ۱۱. د ټیسټ لپاره جوړ شوي APK اپلوډ کول د ګیټ هاب آرټیفیکټس ته
      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Speaker-Guide-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ۱۲. د ګوګل پلی (AAB) د پایلې فایل اپلوډ کول
      - name: Upload Play Store Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Speaker-Guide-PlayStore-AAB
          path: |
            android/app/build/outputs/bundle/release/*.aab
            ${{ steps.sign_app.outputs.signedReleaseFile }}
